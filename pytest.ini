[pytest]
# The volttron-testing plugin is also an entry point; naming it here covers a checkout on PYTHONPATH. pytester
# runs the plugin's own tests.
addopts = -p volttrontesting.plugin -p pytester
markers =
    control: Test for volttron-ctl or vctl commands
    config_store: Test for configuration store functionality
    pubsub: Test for publish/subscribe functionality
